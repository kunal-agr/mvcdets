<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Daily Expense Tracker - Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/datepicker3.css">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
<div class="row">
    <h2 class="text-center">Daily Expense Tracker</h2>
    <hr/>

    <div class="col-xs-10 col-xs-offset-1
                col-sm-8 col-sm-offset-2
                col-md-4 col-md-offset-4">

        <div class="login-panel panel panel-default">
            <div class="panel-heading">Log in</div>

            <div class="panel-body">

                <div id="messageBox" class="alert text-center" style="display:none;"></div>

                <form id="loginForm">
                    <fieldset>
                        <div class="form-group">
                            <input class="form-control"
                                   placeholder="E-mail"
                                   name="email"
                                   type="email"
                                   required>
                        </div>

                        <div class="form-group">
                            <input class="form-control"
                                   placeholder="Password"
                                   name="password"
                                   type="password"
                                   required>
                        </div>

                        <a href="forgot-password.html">Forgot Password?</a>
                        <br><br>

                        <button type="submit"
                                class="btn btn-primary btn-block">
                            Login
                        </button>

                        <hr>

                        <a href="register.html"
                           class="btn btn-success btn-block">
                            Register
                        </a>
                    </fieldset>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="js/jquery-1.11.1.min.js"></script>
<script src="js/bootstrap.min.js"></script>

<script>
    const form = document.getElementById("loginForm");
    const messageBox = document.getElementById("messageBox");

    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        const success = urlParams.get('success');
        const error = urlParams.get('error');

        if (success === "1") {
            showMessage("You have registered successfully", "alert-success");
        } else if (error === "1") {
            showMessage("Invalid email or password", "alert-danger");
        } else if (error === "2") {
            showMessage("Invalid email or mobile", "alert-danger");
        } else if (error === "3") {
            showMessage("Password cannot be reset", "alert-danger");
        }
    };

    function showMessage(msg, type) {
        messageBox.innerText = msg;
        messageBox.className = `alert text-center ${type}`;
        messageBox.style.display = "block";
    }

    form.addEventListener("submit", function (e) {
        e.preventDefault();
        loginUser();
    });

    function loginUser() {
        messageBox.style.display = "none";

        const email = document.querySelector('input[name="email"]').value;
        const password = document.querySelector('input[name="password"]').value;

        fetch("api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({ email, password })
        })
        .then(async res => {
            // Parse the JSON data from the response
            const data = await res.json();

            if (res.status === 200) {
                // --- THE CRITICAL FIX IS HERE ---
                // We save the user info so change-password.html can see it.
                sessionStorage.setItem("userId", data.userId);
                sessionStorage.setItem("userName", data.name || "User");

                window.location.href = "dashboard.html";
            } else if (res.status === 401) {
                showMessage("Invalid email or password", "alert-danger");
            } else {
                showMessage(data.message || "Server error. Try again.", "alert-danger");
            }
        })
        .catch(err => {
            console.error(err);
            showMessage("Network error. Check server.", "alert-danger");
        });
    }
</script>

</body>
</html>
