<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Daily Expense Tracker || Change Password</title>
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/font-awesome.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>

<script type="text/babel">
    const { useState, useEffect } = React;

    function ChangePassword() {
        const [username, setUsername] = useState("User");
        const [isLoading, setIsLoading] = useState(true);
        const [formData, setFormData] = useState({
            currentPassword: "",
            newPassword: "",
            confirmPassword: ""
        });

        useEffect(() => {
            const name = sessionStorage.getItem("userName");
            const userId = sessionStorage.getItem("userId");

            // SESSION CHECK: If no userId is found, go to login
            if (!userId) {
                window.location.href = 'index.html';
            } else {
                if (name) setUsername(name);
                setIsLoading(false);
            }
        }, []);

        const handleInputChange = (e) => {
            const { name, value } = e.target;
            setFormData({ ...formData, [name]: value });
        };

        const logout = async (e) => {
            if(e) e.preventDefault();
            try {
                await fetch('api/auth/logout', { method: 'POST' });
                sessionStorage.clear();
                window.location.href = 'index.html';
            } catch (err) {
                alert("Logout failed");
            }
        };

        const handleSubmit = async (e) => {
            e.preventDefault();

            if (formData.newPassword !== formData.confirmPassword) {
                alert('New Password and Confirm Password do not match');
                return;
            }

            const userId = sessionStorage.getItem("userId");

            try {
                const res = await fetch('api/auth/change-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: userId,
                        currentPassword: formData.currentPassword,
                        newPassword: formData.newPassword
                    })
                });

                const data = await res.json();
                if (res.ok) {
                    alert(data.message || "Password changed successfully!");
                    setFormData({ currentPassword: "", newPassword: "", confirmPassword: "" });
                } else {
                    alert(data.error || "Failed to change password");
                }
            } catch (err) {
                alert("An error occurred: " + err.message);
            }
        };

        // Don't show the UI until the session is verified
        if (isLoading) {
            return null;
        }

        return (
            <div id="wrapper">
                <nav className="navbar navbar-custom navbar-fixed-top" role="navigation">
                    <div className="container-fluid">
                        <div className="navbar-header">
                            <button type="button" className="navbar-toggle collapsed" data-toggle="collapse" data-target="#sidebar-collapse">
                                <span className="sr-only">Toggle navigation</span>
                                <span className="icon-bar"></span><span className="icon-bar"></span><span className="icon-bar"></span>
                            </button>
                            <a className="navbar-brand" href="dashboard.html"><span>Daily Expense Tracker</span></a>
                        </div>
                    </div>
                </nav>

                <div id="sidebar-collapse" className="col-sm-3 col-lg-2 sidebar">
                    <div className="profile-sidebar">
                        <div className="profile-usertitle" style={{ marginLeft: '20px', marginTop: '10px' }}>
                            <div className="profile-usertitle-name">{username}</div>
                            <div className="profile-usertitle-status"><span className="indicator label-success"></span>Online</div>
                        </div>
                        <div className="clear"></div>
                    </div>
                    <div className="divider"></div>

                    <ul className="nav menu">
                        <li><a href="dashboard.html"><em className="fa fa-dashboard">&nbsp;</em> Dashboard</a></li>

                        {/* Expenses Dropdown */}
                        <li className="parent">
                            <a data-toggle="collapse" href="#sub-item-1">
                                <em className="fa fa-navicon">&nbsp;</em>Expenses <span className="icon pull-right"><em className="fa fa-plus"></em></span>
                            </a>
                            <ul className="children collapse" id="sub-item-1">
                                <li><a href="add-expense.html"><span className="fa fa-arrow-right">&nbsp;</span> Add Expenses</a></li>
                                <li><a href="manage-expense.html"><span className="fa fa-arrow-right">&nbsp;</span> Manage Expenses</a></li>
                            </ul>
                        </li>

                        {/* Reports Dropdown */}
                        <li className="parent">
                            <a data-toggle="collapse" href="#sub-item-2">
                                <em className="fa fa-navicon">&nbsp;</em>Expense Report <span className="icon pull-right"><em className="fa fa-plus"></em></span>
                            </a>
                            <ul className="children collapse" id="sub-item-2">
                                <li><a href="expense-datewise-reports.html"><span className="fa fa-arrow-right">&nbsp;</span> Daywise Expenses</a></li>
                                <li><a href="expense-monthwise-reports.html"><span className="fa fa-arrow-right">&nbsp;</span> Monthwise Expenses</a></li>
                                <li><a href="expense-yearwise-reports.html"><span className="fa fa-arrow-right">&nbsp;</span> Yearwise Expenses</a></li>
                            </ul>
                        </li>

                        <li><a href="user-profile.html"><em className="fa fa-user">&nbsp;</em> Profile</a></li>
                        <li className="active"><a href="change-password.html"><em className="fa fa-clone">&nbsp;</em> Change Password</a></li>
                        <li><a href="#" onClick={logout}><em className="fa fa-power-off">&nbsp;</em> Logout</a></li>
                    </ul>
                </div>

                <div className="col-sm-9 col-sm-offset-3 col-lg-10 col-lg-offset-2 main">
                    <div className="row">
                        <ol className="breadcrumb">
                            <li><a href="dashboard.html"><em className="fa fa-home"></em></a></li>
                            <li className="active">Change Password</li>
                        </ol>
                    </div>

                    <div className="row">
                        <div className="col-lg-12">
                            <div className="panel panel-default">
                                <div className="panel-heading">Change Password</div>
                                <div className="panel-body">
                                    <form onSubmit={handleSubmit}>
                                        <div className="form-group">
                                            <label>Current Password</label>
                                            <input
                                                type="password"
                                                name="currentPassword"
                                                className="form-control"
                                                value={formData.currentPassword}
                                                onChange={handleInputChange}
                                                required
                                            />
                                        </div>
                                        <div className="form-group">
                                            <label>New Password</label>
                                            <input
                                                type="password"
                                                name="newPassword"
                                                className="form-control"
                                                value={formData.newPassword}
                                                onChange={handleInputChange}
                                                required
                                            />
                                        </div>
                                        <div className="form-group">
                                            <label>Confirm Password</label>
                                            <input
                                                type="password"
                                                name="confirmPassword"
                                                className="form-control"
                                                value={formData.confirmPassword}
                                                onChange={handleInputChange}
                                                required
                                            />
                                        </div>
                                        <button type="submit" className="btn btn-primary">Change</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ChangePassword />);
</script>
</body>
</html>
