<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Daily Expense Tracker - Reset Password</title>

    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/datepicker3.css">
    <link rel="stylesheet" href="css/styles.css">

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>
    <div id="root"></div>

    <script src="js/jquery-1.11.1.min.js"></script>
    <script src="js/bootstrap.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function ResetPasswordApp() {
            const [newPassword, setNewPassword] = useState('');
            const [confirmPassword, setConfirmPassword] = useState('');
            const [error, setError] = useState('');
            const [success, setSuccess] = useState('');
            const [userId, setUserId] = useState(null);

            useEffect(() => {
                // Get userId saved from the forgot-password step
                const savedId = sessionStorage.getItem("resetUserId");
                if (!savedId) {
                    setError("No user session found. Please start from Forgot Password.");
                } else {
                    setUserId(savedId);
                }
            }, []);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError('');
                setSuccess('');

                if (newPassword !== confirmPassword) {
                    setError("New Password and Confirm Password do not match");
                    return;
                }

                try {
                    // Using relative path for MVC_DETS context
                    const response = await fetch('api/auth/reset', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            password: newPassword,
                            userId: userId
                        })
                    });

                    const data = await response.json().catch(() => ({}));

                    if (response.ok) {
                        setSuccess(data.message || "Password reset successfully!");
                        setNewPassword('');
                        setConfirmPassword('');
                        // Redirect to login after 2 seconds
                        setTimeout(() => window.location.href = 'index.html', 2000);
                    } else {
                        setError(data.error || "Password reset failed.");
                    }
                } catch (err) {
                    setError("Network error. Please try again.");
                }
            };

            return (
                <div className="row">
                    <h2 style={{ textAlign: 'center' }}>Daily Expense Tracker</h2>
                    <hr />

                    <div className="col-xs-10 col-xs-offset-1 col-sm-8 col-sm-offset-2 col-md-4 col-md-offset-4">
                        <div className="login-panel panel panel-default">
                            <div className="panel-heading">Reset Password</div>

                            <div className="panel-body">
                                {error && (
                                    <div className="alert alert-danger text-center">
                                        {error}
                                    </div>
                                )}

                                {success && (
                                    <div className="alert alert-success text-center">
                                        {success}
                                    </div>
                                )}

                                <form onSubmit={handleSubmit}>
                                    <fieldset>
                                        <div className="form-group">
                                            <input
                                                className="form-control"
                                                placeholder="New Password"
                                                type="password"
                                                value={newPassword}
                                                onChange={(e) => setNewPassword(e.target.value)}
                                                required
                                            />
                                        </div>

                                        <div className="form-group">
                                            <input
                                                className="form-control"
                                                placeholder="Confirm Password"
                                                type="password"
                                                value={confirmPassword}
                                                onChange={(e) => setConfirmPassword(e.target.value)}
                                                required
                                            />
                                        </div>

                                        <button type="submit" className="btn btn-primary btn-block">
                                            Reset Password
                                        </button>

                                        <hr />

                                        <a href="index.html" className="btn btn-success btn-block">
                                            Back to Login
                                        </a>
                                    </fieldset>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ResetPasswordApp />);
    </script>
</body>
</html>
