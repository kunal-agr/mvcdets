<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot Password</title>

    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>
    <div id="root"></div>

    <script src="js/jquery-1.11.1.min.js"></script>

    <script type="text/babel">
        const { useState } = React;

        function ForgotPasswordApp() {
            const [email, setEmail] = useState('');
            const [mobile, setMobile] = useState('');
            const [error, setError] = useState('');
            const [success, setSuccess] = useState('');

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError('');
                setSuccess('');

                try {
                    // Using relative path to support /MVC_DETS/ context
                    const response = await fetch('api/auth/forgot', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, mobile })
                    });

                    if (response.ok) {
                        const data = await response.json();
                        // Store the ID for the next step in the reset process
                        sessionStorage.setItem("resetUserId", data.userId);
                        window.location.href = 'reset-password.html';
                    } else {
                        const data = await response.json().catch(() => ({}));
                        setError(data.error || "Invalid email or mobile number");
                    }
                } catch (err) {
                    setError("Network error. Please try again.");
                }
            };

            return (
                <div className="row">
                    <h2 className="text-center">Daily Expense Tracker</h2>
                    <hr/>
                    <div className="col-md-4 col-md-offset-4">
                        <div className="panel panel-default">
                            <div className="panel-heading">Forgot Password</div>
                            <div className="panel-body">

                                {error && (
                                    <div className="alert alert-danger text-center">
                                        {error}
                                    </div>
                                )}

                                {success && (
                                    <div className="alert alert-success text-center">
                                        {success}
                                    </div>
                                )}

                                <form onSubmit={handleSubmit}>
                                    <div className="form-group">
                                        <input
                                            className="form-control"
                                            name="email"
                                            placeholder="Email"
                                            type="email"
                                            value={email}
                                            onChange={(e) => setEmail(e.target.value)}
                                            required
                                        />
                                    </div>
                                    <div className="form-group">
                                        <input
                                            className="form-control"
                                            name="mobile"
                                            placeholder="Mobile Number"
                                            type="text"
                                            pattern="[0-9]{10}"
                                            value={mobile}
                                            onChange={(e) => setMobile(e.target.value)}
                                            required
                                        />
                                    </div>
                                    <button type="submit" className="btn btn-primary btn-block">
                                        Verify
                                    </button>
                                    <hr />
                                    <a href="index.html" className="btn btn-default btn-block">
                                        Back to Login
                                    </a>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ForgotPasswordApp />);
    </script>
</body>
</html>
