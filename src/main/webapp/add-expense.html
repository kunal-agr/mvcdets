<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Daily Expense Tracker || Add Expense</title>
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/font-awesome.min.css" rel="stylesheet">
    <link href="css/datepicker3.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>

<script type="text/babel">
    const { useState, useEffect } = React;

    function AddExpenseApp() {
        const [username, setUsername] = useState("User");
        const [msg, setMsg] = useState({ text: "", type: "" });
        const [formData, setFormData] = useState({
            dateExpense: "",
            item: "",
            amount: "",
            category: "Food"
        });

        useEffect(() => {
            // Fetch name from sessionStorage (set during login)
            const storedName = sessionStorage.getItem("userName");
            if (storedName) {
                setUsername(storedName);
            } else {
                // Fallback: If session storage is empty, try to fetch from profile API
                fetch('api/user/profile')
                    .then(res => res.json())
                    .then(data => {
                        if(data.user) {
                            setUsername(data.user.name);
                            sessionStorage.setItem("userName", data.user.name);
                        }
                    })
                    .catch(() => setUsername("User"));
            }
        }, []);

        const handleChange = (e) => {
            setFormData({ ...formData, [e.target.name]: e.target.value });
        };

        const handleSubmit = async (e) => {
            e.preventDefault();
            setMsg({ text: "", type: "" });

            try {
                const res = await fetch('api/expenses', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        expenseDate: formData.dateExpense,
                        description: formData.item,
                        amount: parseFloat(formData.amount),
                        category: formData.category
                    })
                });

                if (res.ok) {
                    setMsg({ text: "Expense added successfully!", type: "success" });
                    setFormData({ dateExpense: "", item: "", amount: "", category: "Food" });
                } else {
                    const data = await res.json();
                    setMsg({ text: data.error || "Failed to add expense", type: "danger" });
                }
            } catch (err) {
                setMsg({ text: "Network error", type: "danger" });
            }
        };

        const logout = async (e) => {
            e.preventDefault();
            try {
                await fetch('api/auth/logout', { method: 'POST' });
                sessionStorage.clear();
                window.location.href = 'index.html';
            } catch (e) {
                alert('Logout failed');
            }
        };

        return (
            <div id="wrapper">
                <nav className="navbar navbar-custom navbar-fixed-top" role="navigation">
                    <div className="container-fluid">
                        <div className="navbar-header">
                            <a className="navbar-brand" href="dashboard.html">
                                <span>Daily Expense Tracker</span>
                            </a>
                        </div>
                    </div>
                </nav>

                <div id="sidebar-collapse" className="col-sm-3 col-lg-2 sidebar">
                    <div className="profile-sidebar">
                        <div className="profile-usertitle" style={{ marginLeft: '20px', marginTop: '10px' }}>
                            <div className="profile-usertitle-name">{username}</div>
                            <div className="profile-usertitle-status">
                                <span className="indicator label-success"></span>Online
                            </div>
                        </div>
                        <div className="clear"></div>
                    </div>
                    <div className="divider"></div>

                    <ul className="nav menu">
                        <li><a href="dashboard.html"><em className="fa fa-dashboard">&nbsp;</em> Dashboard</a></li>
                        <li className="parent">
                            <a data-toggle="collapse" href="#sub-item-1">
                                <em className="fa fa-navicon">&nbsp;</em>Expenses <span className="icon pull-right"><em className="fa fa-plus"></em></span>
                            </a>
                            <ul className="children collapse in" id="sub-item-1">
                                <li className="active"><a href="add-expense.html"><span className="fa fa-arrow-right">&nbsp;</span> Add Expenses</a></li>
                                <li><a href="manage-expense.html"><span className="fa fa-arrow-right">&nbsp;</span> Manage Expenses</a></li>
                            </ul>
                        </li>
                        <li className="parent">
                            <a data-toggle="collapse" href="#sub-item-2">
                                <em className="fa fa-navicon">&nbsp;</em>Expense Report <span className="icon pull-right"><em className="fa fa-plus"></em></span>
                            </a>
                            <ul className="children collapse" id="sub-item-2">
                                <li><a href="expense-datewise-reports.html"><span className="fa fa-arrow-right">&nbsp;</span> Daywise Expenses</a></li>
                                <li><a href="expense-monthwise-reports.html"><span className="fa fa-arrow-right">&nbsp;</span> Monthwise Expenses</a></li>
                                <li><a href="expense-yearwise-reports.html"><span className="fa fa-arrow-right">&nbsp;</span> Yearwise Expenses</a></li>
                            </ul>
                        </li>
                        <li><a href="user-profile.html"><em className="fa fa-user">&nbsp;</em> Profile</a></li>
                        <li><a href="#" onClick={logout}><em className="fa fa-power-off">&nbsp;</em> Logout</a></li>
                    </ul>
                </div>

                <div className="col-sm-9 col-sm-offset-3 col-lg-10 col-lg-offset-2 main">
                    <div className="row">
                        <ol className="breadcrumb">
                            <li><a href="dashboard.html"><em className="fa fa-home"></em></a></li>
                            <li className="active">Expense</li>
                        </ol>
                    </div>

                    <div className="row">
                        <div className="col-lg-12">
                            <div className="panel panel-default">
                                <div className="panel-heading">Add Expense</div>
                                <div className="panel-body">
                                    {msg.text && (
                                        <div className={`alert alert-${msg.type} text-center`}>{msg.text}</div>
                                    )}
                                    <form onSubmit={handleSubmit}>
                                        <div className="form-group">
                                            <label>Date of Expense</label>
                                            <input className="form-control" type="date" name="dateExpense" value={formData.dateExpense} onChange={handleChange} required />
                                        </div>
                                        <div className="form-group">
                                            <label>Item</label>
                                            <input className="form-control" type="text" name="item" value={formData.item} onChange={handleChange} required />
                                        </div>
                                        <div className="form-group">
                                            <label>Cost of Item</label>
                                            <input className="form-control" type="number" step="0.01" name="amount" value={formData.amount} onChange={handleChange} required />
                                        </div>
                                        <div className="form-group">
                                            <label>Category</label>
                                            <select name="category" className="form-control" value={formData.category} onChange={handleChange}>
                                                <option>Food</option>
                                                <option>Transport</option>
                                                <option>Shopping</option>
                                                <option>Rent</option>
                                                <option>Other</option>
                                            </select>
                                        </div>
                                        <button type="submit" className="btn btn-primary">Add</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AddExpenseApp />);
</script>
</body>
</html>
