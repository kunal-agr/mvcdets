<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Daily Expense Tracker - Register</title>

    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/datepicker3.css">
    <link rel="stylesheet" href="css/styles.css">

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>
<div id="root"></div>

<script src="js/jquery-1.11.1.min.js"></script>
<script src="js/bootstrap.min.js"></script>

<script type="text/babel">
    const { useState } = React;

    function RegisterApp() {
        const [formData, setFormData] = useState({
            name: '',
            email: '',
            mobile: '',
            password: '',
            repeatpassword: ''
        });

        const handleChange = (e) => {
            setFormData({
                ...formData,
                [e.target.name]: e.target.value
            });
        };

        const handleSubmit = async (e) => {
            e.preventDefault();

            // Logic from your checkpass() function
            if (formData.password !== formData.repeatpassword) {
                alert("Password and Repeat Password do not match");
                return;
            }

            try {
                // Note: Ensure the path matches your backend context
                const response = await fetch('api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: formData.name,
                        email: formData.email,
                        mobile: formData.mobile,
                        password: formData.password
                    })
                });

                if (response.ok) {
                    window.location.href = 'index.html?success=1';
                } else {
                    throw new Error('Failed');
                }
            } catch (error) {
                alert('Registration failed');
            }
        };

        return (
            <div className="row">
                <h2 style={{ textAlign: 'center' }}>Daily Expense Tracker</h2>
                <hr/>

                <div className="col-xs-10 col-xs-offset-1 col-sm-8 col-sm-offset-2 col-md-4 col-md-offset-4">
                    <div className="login-panel panel panel-default">
                        <div className="panel-heading">Sign Up</div>
                        <div className="panel-body">
                            <form onSubmit={handleSubmit}>
                                <fieldset>
                                    <div className="form-group">
                                        <input
                                            className="form-control"
                                            placeholder="Full Name"
                                            name="name"
                                            type="text"
                                            value={formData.name}
                                            onChange={handleChange}
                                            required
                                        />
                                    </div>

                                    <div className="form-group">
                                        <input
                                            className="form-control"
                                            placeholder="E-mail"
                                            name="email"
                                            type="email"
                                            value={formData.email}
                                            onChange={handleChange}
                                            required
                                        />
                                    </div>

                                    <div className="form-group">
                                        <input
                                            className="form-control"
                                            placeholder="Mobile Number"
                                            name="mobile"
                                            type="text"
                                            maxLength="10"
                                            minLength="10"
                                            value={formData.mobile}
                                            onChange={handleChange}
                                            required
                                        />
                                    </div>

                                    <div className="form-group">
                                        <input
                                            className="form-control"
                                            placeholder="Password"
                                            name="password"
                                            type="password"
                                            value={formData.password}
                                            onChange={handleChange}
                                            required
                                        />
                                    </div>

                                    <div className="form-group">
                                        <input
                                            className="form-control"
                                            placeholder="Repeat Password"
                                            name="repeatpassword"
                                            type="password"
                                            value={formData.repeatpassword}
                                            onChange={handleChange}
                                            required
                                        />
                                    </div>

                                    <button type="submit" className="btn btn-primary btn-block">
                                        Register
                                    </button>

                                    <hr />

                                    <a href="index.html" className="btn btn-success btn-block">
                                        Back to Login
                                    </a>
                                </fieldset>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<RegisterApp />);
</script>
</body>
</html>
