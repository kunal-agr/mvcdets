version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: mvcdets-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  app:
    build: .
    container_name: mvcdets-app
    restart: always
    depends_on:
      - mongo
    ports:
      - "8080:8080"
    environment:
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_DB: mvcdetsdb

volumes:
  mongo_data:
