services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mvc_backend
    ports:
      - "8080:8080"
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/firebase-key.json
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
    volumes:
      - ./firebase-key.json:/app/firebase-key.json:ro
    networks:
      - mvc_network

networks:
  mvc_network:
    driver: bridge