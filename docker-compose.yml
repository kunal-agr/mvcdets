services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mvc_backend
    ports:
      - "8080:8080"
    environment:
      # Tell backend where to find the emulator (on host machine)
      - FIRESTORE_EMULATOR_HOST=host.docker.internal:8085
      - FIREBASE_PROJECT_ID=mvcdets
    networks:
      - mvc_network

networks:
  mvc_network:
    driver: bridge