version: '3.9'

services:
  db:
    image: postgres:15
    container_name: mypostgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mvcdetsdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d
    networks:
      - mynet

  app:
    build: .
    image: daily-expense-tracker
    container_name: daily-expense-tracker
    depends_on:
      - db
    ports:
      - "8080:8080"
    networks:
      - mynet

volumes:
  pgdata:

networks:
  mynet:
    driver: bridge