version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mvc_backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - mongodb
    # Optional: Wait for MongoDB to be ready
    command: >
      sh -c "
        until nc -z mongodb 27017; do
          echo 'Waiting for MongoDB...'
          sleep 2
        done
        catalina.sh run
      "

  mongodb:
    image: mongo:7
    container_name: mvc_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # Optional: cache Maven dependencies for faster rebuilds
  maven_cache:
    image: busybox
    volumes:
      - maven_repo:/root/.m2

volumes:
  mongo_data:
  maven_repo:
